<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1064" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      /* Core SVG styling */
      text { user-select: none; }
      .bg-main { fill: #020617; }
      
      /* Box Styling */
      .box-outer { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 12px; }
      .box-inner { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8px; transition: all 0.3s ease; }
      .box-inner:hover { filter: brightness(1.15); stroke: #64748b; cursor: pointer; }
      
      /* Typography */
      .text-title { font-family: 'Inter', system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .text-subtitle { font-family: 'Fira Code', monospace; font-size: 17px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
      .text-code { font-family: 'Fira Code', monospace; font-size: 17px; fill: #cbd5e1; text-anchor: middle; }
      .text-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 17px; fill: #94a3b8; text-anchor: middle; }
      
      /* Semantic Colors - Professional Palette */
      .hl-class { fill: #94a3b8; font-weight: 600; } /* Neutral Slate for Logic/Classes */
      .hl-string { fill: #fdba74; }
      .hl-bool { fill: #5eead4; }
      .hl-kw { fill: #7dd3fc; }
      
      /* Feature colors stay consistent across labels and paths. */
      .hl-num { fill: #38bdf8; font-weight: 600; } /* Numerical, including derived counts */
      .hl-nom { fill: #facc15; font-weight: 600; } /* Amber Yellow */
      .hl-bin { fill: #d8b4fe; font-weight: 600; } /* Purple/Lavender */
      
      /* Path Lines */
      .base-line { stroke: #1e293b; stroke-width: 6; fill: none; stroke-linejoin: round; }
      .flow-line { 
        stroke: #94a3b8; 
        stroke-width: 3.5; 
        fill: none; 
        stroke-dasharray: 10 10; 
        stroke-linejoin: round;
        animation: flow 1.5s linear infinite; 
      }
      
      /* Flow lane specific colors - Matching features */
      .flow-num { stroke: #38bdf8; }
      .flow-nom { stroke: #facc15; }
      .flow-bin { stroke: #d8b4fe; }

      /* Animations */
      @keyframes flow {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulse-box {
        0%, 100% { stroke: #334155; filter: none; }
        50% { stroke: #475569; filter: drop-shadow(0 0 10px rgba(71, 85, 105, 0.4)); }
      }

      .pulse-1 { animation: pulse-box 9s infinite; animation-delay: 0s; }
      .pulse-2 { animation: pulse-box 9s infinite; animation-delay: 1.5s; }
      .pulse-3 { animation: pulse-box 9s infinite; animation-delay: 3s; }
      .pulse-4 { animation: pulse-box 9s infinite; animation-delay: 4.5s; }
      .pulse-5 { animation: pulse-box 9s infinite; animation-delay: 6s; }
      .pulse-out { animation: pulse-box 9s infinite; animation-delay: 7.5s; }
    </style>

    <!-- Drop Shadow Filter for Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Arrows for each feature type -->
    <marker id="arrow-def" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
       <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-num" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-nom" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#facc15" />
    </marker>
    <marker id="arrow-bin" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
       <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8b4fe" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-main" />

  <!-- Global Header -->
  <g transform="translate(500, 38)">
    <text class="text-title" style="font-size: 29px;">Preprocessing Pipeline</text>
    <text y="28" class="text-subtitle" style="font-size: 19px;">Fitted on training data</text>
  </g>

  <!-- Connections between stages -->
  <g id="data-connections">
    <!-- Input to Step 1 -->
    <path d="M 500,150 L 500,182" class="base-line" />
    <path d="M 500,150 L 500,182" class="flow-line" marker-end="url(#arrow-def)" />

    <!-- Step 1 to Step 2 -->
    <path d="M 500,298 L 500,330" class="base-line" />
    <path d="M 500,298 L 500,330" class="flow-line" marker-end="url(#arrow-def)" />

    <!-- Split into numerical and categorical imputation -->
    <path d="M 500,446 C 500,472 295,472 295,498" class="base-line" />
    <path d="M 500,446 C 500,472 705,472 705,498" class="base-line" />
    <path d="M 500,446 C 500,472 295,472 295,498" class="flow-line flow-num" marker-end="url(#arrow-num)" />
    <path d="M 500,446 C 500,472 705,472 705,498" class="flow-line" marker-end="url(#arrow-def)" />

    <!-- Merge before deriving features -->
    <path d="M 295,606 C 295,632 500,632 500,658" class="base-line" />
    <path d="M 705,606 C 705,632 500,632 500,658" class="base-line" />
    <path d="M 295,606 C 295,632 500,632 500,658" class="flow-line flow-num" marker-end="url(#arrow-num)" />
    <path d="M 705,606 C 705,632 500,632 500,658" class="flow-line" marker-end="url(#arrow-def)" />

    <!-- Split into scaling, encoding, and binary passthrough -->
    <path d="M 500,778 C 500,804 200,804 200,830" class="base-line" />
    <path d="M 500,778 L 500,830" class="base-line" />
    <path d="M 500,778 C 500,804 800,804 800,830" class="base-line" />
    <path d="M 500,778 C 500,804 200,804 200,830" class="flow-line flow-num" marker-end="url(#arrow-num)" />
    <path d="M 500,778 L 500,830" class="flow-line flow-nom" marker-end="url(#arrow-nom)" />
    <path d="M 500,778 C 500,804 800,804 800,830" class="flow-line flow-bin" marker-end="url(#arrow-bin)" />

    <!-- Merge into model-ready features -->
    <path d="M 200,954 C 200,980 500,980 500,1006" class="base-line" />
    <path d="M 500,954 L 500,1006" class="base-line" />
    <path d="M 800,954 C 800,980 500,980 500,1006" class="base-line" />
    <path d="M 200,954 C 200,980 500,980 500,1006" class="flow-line flow-num" marker-end="url(#arrow-num)" />
    <path d="M 500,954 L 500,1006" class="flow-line flow-nom" marker-end="url(#arrow-nom)" />
    <path d="M 800,954 C 800,980 500,980 500,1006" class="flow-line flow-bin" marker-end="url(#arrow-bin)" />
  </g>

  <!-- Input features -->
  <g id="input-data" transform="translate(100, 86)">
    <rect width="800" height="64" class="box-outer" style="fill: #0b0f19;" />
    <text x="400" y="27" class="text-title">Input features</text>
    <text x="400" y="50" class="text-code">
      <tspan class="hl-num">Numerical</tspan> | <tspan class="hl-nom">Nominal</tspan> | <tspan class="hl-bin">Binary</tspan>
    </text>
  </g>

  <!-- Step 1: Categorical label standardization -->
  <g id="step-1" transform="translate(100, 182)">
    <rect width="800" height="116" class="box-outer pulse-1" />
    <text x="400" y="29" class="text-title">1. Standardize categorical labels</text>
    <g transform="translate(20, 43)">
      <rect width="370" height="56" class="box-inner" />
      <rect width="4" height="56" fill="#facc15" rx="2" />
      <text x="185" y="22" class="text-subtitle" style="fill: #facc15;">Nominal features</text>
      <text x="185" y="45" class="text-desc">Numbers or text → consistent labels</text>
    </g>
    <g transform="translate(410, 43)">
      <rect width="370" height="56" class="box-inner" />
      <rect width="4" height="56" fill="#d8b4fe" rx="2" />
      <text x="185" y="22" class="text-subtitle" style="fill: #d8b4fe;">Binary features</text>
      <text x="185" y="45" class="text-desc">Map labels to 0/1</text>
    </g>
  </g>

  <!-- Step 2: Missing-value checks -->
  <g id="step-2" transform="translate(100, 330)">
    <rect width="800" height="116" class="box-outer pulse-2" />
    <text x="400" y="29" class="text-title">2. Check missing values</text>
    <g transform="translate(20, 43)">
      <rect width="370" height="56" class="box-inner" />
      <text x="185" y="22" class="text-subtitle" style="fill: #f1f5f9;">Required features</text>
      <text x="185" y="45" class="text-desc">Strict mode: error; otherwise log warning</text>
    </g>
    <g transform="translate(410, 43)">
      <rect width="370" height="56" class="box-inner" />
      <text x="185" y="22" class="text-subtitle" style="fill: #f1f5f9;">Optional features</text>
      <text x="185" y="45" class="text-desc">Log warning</text>
    </g>
  </g>

  <!-- Step 3: Imputation -->
  <g id="step-3" transform="translate(80, 498)">
    <rect width="840" height="108" class="box-outer pulse-3" />
    <text x="420" y="27" class="text-title">3. Impute missing values</text>
    <g transform="translate(20, 38)">
      <rect width="390" height="56" class="box-inner" />
      <rect width="5" height="56" fill="#38bdf8" rx="2.5" />
      <text x="195" y="22" class="text-subtitle" style="fill: #38bdf8;">Numerical features</text>
      <text x="195" y="45" class="text-desc">Median imputation</text>
    </g>
    <g transform="translate(430, 38)">
      <rect width="390" height="56" class="box-inner" />
      <rect width="5" height="56" fill="#94a3b8" rx="2.5" />
      <text x="195" y="22" class="text-subtitle"><tspan class="hl-nom">Nominal</tspan> &amp; <tspan class="hl-bin">binary features</tspan></text>
      <text x="195" y="45" class="text-desc">Mode imputation</text>
    </g>
  </g>

  <!-- Step 4: Derived medical features -->
  <g id="step-4" transform="translate(80, 658)">
    <rect width="840" height="120" class="box-outer pulse-4" />
    <text x="420" y="27" class="text-title">4. Derive medical features</text>
    <text x="420" y="53" class="text-desc">Sum binary indicators into counts</text>
    <g transform="translate(20, 66)">
      <rect width="390" height="40" class="box-inner" />
      <rect width="4" height="40" fill="#38bdf8" rx="2" />
      <text x="195" y="26" class="text-desc hl-num">Chronic condition count</text>
    </g>
    <g transform="translate(430, 66)">
      <rect width="390" height="40" class="box-inner" />
      <rect width="4" height="40" fill="#38bdf8" rx="2" />
      <text x="195" y="26" class="text-desc hl-num">Functional limitation count</text>
    </g>
  </g>

  <!-- Step 5: Scaling and encoding -->
  <g id="step-5" transform="translate(40, 830)">
    <rect width="920" height="124" class="box-outer pulse-5" />
    <text x="460" y="27" class="text-title">5. Scale and encode features</text>
    <g transform="translate(20, 38)">
      <rect width="280" height="72" class="box-inner" />
      <rect width="5" height="72" fill="#38bdf8" rx="2.5" />
      <text x="140" y="22" class="text-subtitle" style="fill: #38bdf8;">Standard scaling</text>
      <text x="140" y="44" class="text-desc">Numerical, incl. derived features</text>
      <text x="140" y="64" class="text-desc">Mean 0, variance 1</text>
    </g>
    <g transform="translate(320, 38)">
      <rect width="280" height="72" class="box-inner" />
      <rect width="5" height="72" fill="#facc15" rx="2.5" />
      <text x="140" y="22" class="text-subtitle" style="fill: #facc15;">One-hot encoding</text>
      <text x="140" y="44" class="text-desc">Nominal features</text>
      <text x="140" y="64" class="text-desc">Drop reference category</text>
    </g>
    <g transform="translate(620, 38)">
      <rect width="280" height="72" class="box-inner" />
      <rect width="5" height="72" fill="#d8b4fe" rx="2.5" />
      <text x="140" y="22" class="text-subtitle" style="fill: #d8b4fe;">Passthrough</text>
      <text x="140" y="44" class="text-desc">Binary features</text>
      <text x="140" y="64" class="text-desc">Keep 0/1 values unchanged</text>
    </g>
  </g>

  <!-- Output features -->
  <g id="output-data" transform="translate(100, 1006)">
    <rect width="800" height="44" class="box-outer pulse-out" style="fill: #1e293b;" />
    <text x="400" y="29" class="text-title">Model-ready features</text>
  </g>
</svg>
